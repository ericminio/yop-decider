<section>
  <div class="header">
    <h1 id="invite">Hi,</h1>
  </div>
  <div class="content">
    <div class="form">
      <label name="new-proposal" for="new-proposal"
        >What is your proposal? (concise, actionable behavior)</label
      >
      <input
        id="new-proposal"
        type="text"
        placeholder="I propose that we do this"
      />
      <button type="button" id="submit-proposal" class="action-button">
        Submit
      </button>
    </div>
    <div>
      <p id="success"></p>
      <button class="action-button hidden" id="continue">Continue</button>
    </div>
  </div>
</section>
